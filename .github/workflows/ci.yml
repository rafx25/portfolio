name: CI

# Runs on every push to a long-lived branch and on every pull request.
# Vercel deploys from Git on its own; this pipeline is what stops a broken
# commit from becoming a broken deployment.
on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  # A newer push to the same branch makes the running job pointless.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # `npm ci` installs exactly what package-lock.json pins, and fails if the
      # lockfile and package.json disagree. `npm install` would quietly fix that.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://example.com
